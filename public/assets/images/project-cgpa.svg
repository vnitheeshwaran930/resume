<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bgGrad)"/>
  
  <!-- Browser Frame -->
  <rect x="40" y="30" width="520" height="290" rx="10" fill="#1e1b4b" fill-opacity="0.4" stroke="#4338ca" stroke-width="1.5"/>
  <rect x="40" y="30" width="520" height="35" rx="10" fill="#0f172a"/>
  <circle cx="65" cy="47" r="5" fill="#ef4444"/>
  <circle cx="82" cy="47" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="47" r="5" fill="#10b981"/>
  <text x="300" y="52" fill="#c7d2fe" font-family="sans-serif" font-size="12" text-anchor="middle">Student Academic &amp; CGPA Analytics</text>

  <!-- Metric highlight cards -->
  <rect x="70" y="85" width="135" height="65" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="85" y="105" fill="#a5b4fc" font-family="sans-serif" font-size="10">Current Cumulative CGPA</text>
  <text x="85" y="135" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="24">7.59</text>

  <rect x="230" y="85" width="145" height="65" rx="8" fill="#1e1b4b" stroke="#334155"/>
  <text x="245" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10">Completed Semesters</text>
  <text x="245" y="135" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="24">4 / 8</text>

  <rect x="400" y="85" width="135" height="65" rx="8" fill="#1e1b4b" stroke="#334155"/>
  <text x="415" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10">Target Standing</text>
  <text x="415" y="135" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="22">First Class</text>

  <!-- Chart Area -->
  <rect x="70" y="170" width="465" height="130" rx="8" fill="#0f172a" stroke="#312e81"/>
  <line x1="90" y1="265" x2="510" y2="265" stroke="#334155" stroke-width="1"/>
  <line x1="90" y1="225" x2="510" y2="225" stroke="#1e293b" stroke-dasharray="4,4"/>
  <line x1="90" y1="185" x2="510" y2="185" stroke="#1e293b" stroke-dasharray="4,4"/>

  <!-- Polyline Graph -->
  <polyline points="120,250 210,230 310,210 410,195 500,185" fill="none" stroke="url(#lineGrad)" stroke-width="4"/>
  
  <circle cx="120" cy="250" r="5" fill="#818cf8"/>
  <text x="120" y="280" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Sem 1</text>
  
  <circle cx="210" cy="230" r="5" fill="#818cf8"/>
  <text x="210" y="280" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Sem 2</text>

  <circle cx="310" cy="210" r="5" fill="#a855f7"/>
  <text x="310" y="280" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Sem 3</text>

  <circle cx="410" cy="195" r="6" fill="#ec4899"/>
  <text x="410" y="280" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Sem 4 (7.59)</text>

  <circle cx="500" cy="185" r="5" fill="#10b981" stroke-dasharray="2,2"/>
  <text x="500" y="280" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Goal (8.0+)</text>
</svg>
